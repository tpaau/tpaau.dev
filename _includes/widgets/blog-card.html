<a class="card" style="display:block;" href="{{ include.url }}">
    <h2>{{ include.title }}</h2>
    <p class="post-date">{{ include.date }}</p>
    <div
        class="card-img"
        style="--bg-image: url({{ include.image }});">
    </div>
    <div align="center">
        {%- for tag in include.tags -%}
            {% include widgets/common/tag.html label=tag icon="price" %}
        {%- endfor -%}
    </div>
    <p>{{ include.summary }}</p>
</a>
